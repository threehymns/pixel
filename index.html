
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PixelForge Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/allotment/dist/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ["class"],
        theme: {
          extend: {
            colors: {
              border: "var(--border)",
              input: "var(--input)",
              ring: "var(--ring)",
              background: "var(--background)",
              foreground: "var(--foreground)",
              primary: {
                DEFAULT: "var(--primary)",
                foreground: "var(--primary-foreground)",
              },
              secondary: {
                DEFAULT: "var(--secondary)",
                foreground: "var(--secondary-foreground)",
              },
              destructive: {
                DEFAULT: "var(--destructive)",
                foreground: "var(--destructive-foreground)",
              },
              muted: {
                DEFAULT: "var(--muted)",
                foreground: "var(--muted-foreground)",
              },
              accent: {
                DEFAULT: "var(--accent)",
                foreground: "var(--accent-foreground)",
              },
              popover: {
                DEFAULT: "var(--popover)",
                foreground: "var(--popover-foreground)",
              },
              card: {
                DEFAULT: "var(--card)",
                foreground: "var(--card-foreground)",
              },
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
            spacing: {
              'safe-top': 'env(safe-area-inset-top)',
              'safe-bottom': 'env(safe-area-inset-bottom)',
              'safe-left': 'env(safe-area-inset-left)',
              'safe-right': 'env(safe-area-inset-right)',
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* Base Dark Theme (OKLCH) */
        
        /* #171717 */
        --background: oklch(0.18 0 0);
        /* #e5e5e5 */
        --foreground: oklch(0.92 0 0);

        /* #2b2b2b */
        --card: oklch(0.26 0 0);
        --card-foreground: oklch(0.92 0 0);

        /* #2b2b2b */
        --popover: oklch(0.26 0 0);
        --popover-foreground: oklch(0.92 0 0);

        /* Primary: sky-900 */
        --primary: oklch(0.44 0.10 241);
        --primary-foreground: oklch(1 0 0);

        /* #3f3f3f */
        --secondary: oklch(0.35 0 0);
        --secondary-foreground: oklch(0.92 0 0);

        /* #262626 */
        --muted: oklch(0.24 0 0);
        --muted-foreground: oklch(0.70 0 0);

        /* #4a4a4a */
        --accent: oklch(0.39 0 0);
        --accent-foreground: oklch(0.92 0 0);

        /* #ef4444 */
        --destructive: oklch(0.64 0.21 25);
        --destructive-foreground: oklch(1 0 0);

        /* #3f3f3f */
        --border: oklch(0.35 0 0);
        
        /* #525252 */
        --input: oklch(0.42 0 0);
        
        --ring: oklch(0.76 0.17 76);
        
        --radius: 0.5rem;

        /* Allotment Theme Overrides */
        --sash-size: 8px;
        --sash-hover-size: 8px;
        --focus-border: var(--primary);
        --separator-border: var(--border);
      }

      /* Custom scrollbar for that desktop-app feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--muted);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--input);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: oklch(0.55 0 0);
      }
      
      /* Overlay scrollbar for horizontal toolbars */
      .overlay-scrollbar::-webkit-scrollbar {
        height: 3px;
      }
      .overlay-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--primary);
        border-radius: 10px;
        border: 1px solid transparent;
        background-clip: padding-box;
      }
      .overlay-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      
      /* Utility to hide scrollbar but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body {
        background-color: var(--background);
        color: var(--foreground);
        overflow: hidden; /* Prevent body scroll */
        font-family: 'Figtree', system-ui, -apple-system, sans-serif;
        /* Handle safe area insets for notched phones */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      .safe-top {
        top: env(safe-area-inset-top);
      }

      .pixelated {
        image-rendering: pixelated;
      }
      
      /* Allotment Sash Styling */
      .allotment-module_splitView__L-y5K {
        background: var(--background) !important;
      }
      
      /* Mobile Masking Utilities */
      .mask-fade-edges {
        mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
      }
      
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "allotment": "https://esm.sh/allotment@1.20.2?external=react,react-dom"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
